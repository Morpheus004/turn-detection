[project]
name = "shiprocket-turn-detection"
version = "0.1.0"
description = "Turn Detection ML project"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "numpy",
    "scikit-learn",
    "librosa",
    "soundfile",
    "gradio",
    "wandb",
    "onnxruntime",
    "accelerate",
    "matplotlib",
    "seaborn",
    "pandas",
    "torchcodec"
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
    "pyright>=1.1.370",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "checkpoints",
    "results_plots",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort (import sorting)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade (modern Python syntax)
    "SIM",   # flake8-simplify
    "RUF",   # Ruff-specific rules
]
ignore = [
    "E501",  # Line too long (handled by formatter)
    "B008",  # Do not perform function calls in argument defaults
    "RUF012", # Mutable class attributes
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = ["src", "scripts", "app.py"]
exclude = [
    "**/__pycache__",
    "checkpoints",
    "results_plots",
    ".venv"
]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingTypeStubs = false
useLibraryCodeForTypes = true
